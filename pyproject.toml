[project]
name = "local-ai-benchmark"
version = "0.1.0"
description = "Resource-aware Ollama throughput benchmarks for Apple Silicon Macs"
requires-python = ">=3.11"
dependencies = ["psutil>=6.1,<8", "rich>=13.9,<15"]

[project.scripts]
local-ai-benchmark = "local_bench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/local_bench"]
